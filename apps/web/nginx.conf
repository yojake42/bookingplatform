# Serves the SPA and load-balances /api across every API replica.
# Docker's embedded DNS returns one A record per replica; `resolve` keeps the upstream list fresh
# as replicas are added, removed or restarted.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream api_replicas {
  zone api_replicas 64k;
  server api:3000 resolve;
  keepalive 32;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  client_max_body_size 2m; # media goes straight to object storage, never through the API
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass http://api_replicas;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
