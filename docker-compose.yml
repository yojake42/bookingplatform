# Local development stack: hot-reloading API and web, Postgres, and MinIO standing in for Cloudflare R2.
name: bookingplatform

x-api-env: &api-env
  NODE_ENV: development
  PORT: 3000
  DATABASE_URL: ${DATABASE_URL}
  WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5180}
  SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-bp_session}
  SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-336}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  TRUST_PROXY: ${TRUST_PROXY:-false}
  SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
  SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Site Admin}
  SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
  STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
  STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-}
  STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-}
  STORAGE_BUCKET: ${STORAGE_BUCKET}
  STORAGE_REGION: ${STORAGE_REGION:-auto}
  STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
  STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
  STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-false}
  GEOCODER_URL: ${GEOCODER_URL:-https://photon.komoot.io/api}
  GEOCODER_USER_AGENT: ${GEOCODER_USER_AGENT:-bookingplatform/0.1}
  BOOKING_RATE_LIMIT_PER_HOUR: ${BOOKING_RATE_LIMIT_PER_HOUR:-1000}
  PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-}
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-fake}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  PAYMENT_HOLD_MINUTES: ${PAYMENT_HOLD_MINUTES:-30}
  ALLOW_FAKE_PAYMENTS: ${ALLOW_FAKE_PAYMENTS:-false}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-log}
  BREVO_API_KEY: ${BREVO_API_KEY:-}
  EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-stays@example.com}
  EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Haven}
  EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
  STAFF_NOTIFICATION_EMAILS: ${STAFF_NOTIFICATION_EMAILS:-}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT:-5440}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_HOST_PORT:-9100}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9101}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the bucket and makes it anonymously readable, mirroring an R2 bucket with public access enabled.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/${STORAGE_BUCKET} &&
      mc anonymous set download local/${STORAGE_BUCKET}"
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    environment:
      <<: *api-env
      CHOKIDAR_USEPOLLING: "true"
      TSC_WATCHFILE: PriorityPollingInterval
      TSC_WATCHDIRECTORY: RecursiveDirectoryUsingDynamicPriorityPolling
    ports:
      - "${API_HOST_PORT:-3100}:3000"
    volumes:
      - .:/workspace
      - api_node_modules:/workspace/node_modules
      - api_app_node_modules:/workspace/apps/api/node_modules
      - api_web_node_modules:/workspace/apps/web/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 60
    command: >
      sh -c "npm install --no-audit --no-fund &&
      npm run prisma:generate -w apps/api &&
      npm run db:deploy -w apps/api &&
      npm run seed -w apps/api &&
      npm run start:dev -w apps/api"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    environment:
      CHOKIDAR_USEPOLLING: "true"
      API_PROXY_TARGET: http://api:3000
    ports:
      - "${WEB_HOST_PORT:-5180}:5173"
    volumes:
      - .:/workspace
      - web_node_modules:/workspace/node_modules
      - web_app_node_modules:/workspace/apps/web/node_modules
      - web_api_node_modules:/workspace/apps/api/node_modules
    depends_on:
      api:
        condition: service_started
    command: >
      sh -c "npm install --no-audit --no-fund && npm run dev -w apps/web -- --host 0.0.0.0 --port 5173"

volumes:
  postgres_data:
  minio_data:
  api_node_modules:
  api_app_node_modules:
  api_web_node_modules:
  web_node_modules:
  web_app_node_modules:
  web_api_node_modules:
